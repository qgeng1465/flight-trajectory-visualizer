    <style>:root{--accent:#2dd4bf;--accent-2:#38bdf8;--gold:#fbbf24;--danger:#fb7185;--bg-0:#04070f;--bg-1:#0a1424;--text:#eaf2fb;--muted:#8aa3bd;--line:rgba(148,200,255,0.14)}body{margin:0;overflow:hidden;color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;background:radial-gradient(1400px 900px at 72% 28%,#0d2440 0%,#071223 46%,var(--bg-0) 100%);font-variant-numeric:tabular-nums}#ui{position:absolute;top:16px;right:16px;z-index:1000;pointer-events:auto;padding:18px;width:344px;max-height:calc(100vh - 32px);overflow-y:auto;box-sizing:border-box;background:linear-gradient(165deg,rgba(16,32,52,0.86),rgba(7,14,26,0.9));border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(16px) saturate(1.35);-webkit-backdrop-filter:blur(16px) saturate(1.35);box-shadow:0 18px 50px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.05);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1),opacity 0.35s;transform:translateX(0)}#ui.collapsed{transform:translateX(calc(100% + 34px));opacity:0;pointer-events:none}#ui *{pointer-events:auto}#ui::-webkit-scrollbar{width:5px}#ui::-webkit-scrollbar-thumb{background:rgba(148,200,255,0.18);border-radius:3px}#btn-show-ui{position:absolute;top:16px;right:16px;z-index:1001;pointer-events:auto;width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(165deg,rgba(16,32,52,0.9),rgba(7,14,26,0.94));border:1px solid var(--line);border-radius:11px;color:var(--muted);font-size:18px;backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 8px 26px rgba(0,0,0,0.5);transition:0.2s;cursor:pointer;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}#btn-show-ui:hover{color:var(--accent);border-color:rgba(45,212,191,0.6);transform:scale(1.07);box-shadow:0 8px 26px rgba(45,212,191,0.18)}#btn-show-ui:active{transform:scale(0.94)}h3{margin:0 0 14px;font-size:17px;font-weight:700;letter-spacing:0.4px;width:85%;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.group{margin-bottom:12px;position:relative}label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:0.3px}input[type="text"],input[type="file"],select,button{width:100%;box-sizing:border-box;background:rgba(10,20,36,0.65);color:var(--text);border:1px solid rgba(148,200,255,0.16);padding:8px 10px;border-radius:8px;font-size:13px;transition:border-color 0.18s,box-shadow 0.18s,background 0.18s}input[type="text"]:focus,select:focus{outline:none;border-color:rgba(45,212,191,0.65);box-shadow:0 0 0 3px rgba(45,212,191,0.12)}input[type="file"],select,button{cursor:pointer}input[type="text"]{cursor:text}input[type="file"]::-webkit-file-upload-button{cursor:pointer}button{cursor:pointer;margin-top:5px;background:rgba(10,20,36,0.65)}button:hover{border-color:rgba(45,212,191,0.6);background:rgba(45,212,191,0.07)}button:active{transform:translateY(1px)}button:disabled{opacity:0.4;cursor:not-allowed;border-color:rgba(148,200,255,0.14);color:var(--muted);background:rgba(10,20,36,0.4)}#sys-msg{font-size:11px;color:#ffd9a0;margin-top:10px;font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;line-height:1.55;background:rgba(6,12,22,0.7);padding:9px 10px;border-radius:8px;border:1px solid rgba(148,200,255,0.1)}.active{border-color:rgba(45,212,191,0.7) !important;color:var(--accent) !important;background:rgba(45,212,191,0.1) !important}.flex{display:flex;gap:6px;margin-bottom:12px}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:rgba(148,200,255,0.2);border-radius:3px}::-webkit-scrollbar-track{background:transparent}#sugg-box{display:none;position:absolute;top:100%;left:0;width:100%;z-index:9999;margin-top:3px;background:linear-gradient(165deg,rgba(13,25,44,0.97),rgba(6,12,22,0.98));border:1px solid var(--line);border-radius:10px;max-height:280px;overflow-y:auto;box-shadow:0 16px 40px rgba(0,0,0,0.65);backdrop-filter:blur(12px)}.sugg-item{padding:10px 12px;font-size:12px;color:var(--text);cursor:pointer;border-bottom:1px solid rgba(148,200,255,0.08);line-height:1.4;transition:background 0.14s}.sugg-item:last-child{border-bottom:none}.sugg-item:hover{background:rgba(45,212,191,0.14)}.match-hl{color:var(--accent);font-weight:700}.sugg-item:hover .match-hl{color:var(--accent)}.type-badge{display:inline-block;padding:2px 5px;background:rgba(148,200,255,0.12);border-radius:4px;font-size:10px;margin-right:5px;color:var(--accent-2)}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.stat-card{position:relative;text-align:center;padding:11px 6px;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,rgba(45,212,191,0.07),rgba(45,212,191,0.02));border:1px solid rgba(45,212,191,0.16)}.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(45,212,191,0.5),transparent)}.stat-num{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:21px;font-weight:700;color:var(--accent);line-height:1.1}.stat-label{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:0.3px}.stat-unit{color:var(--accent);opacity:0.85}.sort-btn,.filter-btn{flex:1;margin-top:0}.filter-btn.active{border-color:rgba(56,189,248,0.7) !important;color:var(--accent-2) !important;background:rgba(56,189,248,0.1) !important}#btn-replay{border-color:rgba(251,191,36,0.55);color:var(--gold)}#btn-replay:hover{background:rgba(251,191,36,0.1);border-color:rgba(251,191,36,0.8)}#btn-stop{border-color:rgba(251,113,133,0.55);color:var(--danger)}#btn-cancel-focus:hover{border-color:var(--gold);color:var(--gold)}#flight-list{max-height:32vh;overflow-y:auto;margin-top:8px;padding-right:4px}.flight-card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,0.035),rgba(255,255,255,0.01));border:1px solid rgba(148,200,255,0.1);border-left:3px solid rgba(148,200,255,0.25);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:0.18s}.flight-card:hover{background:rgba(45,212,191,0.07);border-color:rgba(45,212,191,0.45);border-left-color:var(--accent);transform:translateX(4px)}.flight-card.selected{background:linear-gradient(180deg,rgba(251,191,36,0.1),rgba(251,191,36,0.03));border-color:rgba(251,191,36,0.55);border-left-color:var(--gold);box-shadow:0 4px 20px rgba(251,191,36,0.15),inset 0 0 12px rgba(251,191,36,0.05);transform:translateX(4px)}.fc-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.fc-id{font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--accent);font-size:13px;letter-spacing:0.4px}.fc-airline{font-size:10px;font-weight:500;color:var(--accent-2);letter-spacing:0.3px}.flight-card.selected .fc-id{color:var(--gold)}.fc-date{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}.fc-row2{display:flex;align-items:center;gap:10px}.fc-iata{font-family:ui-monospace,Consolas,monospace;font-size:22px;font-weight:700;color:var(--text);letter-spacing:1px}.fc-plane{color:var(--accent);font-size:14px}.flight-card.selected .fc-plane{color:var(--gold)}.fc-names{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fc-row3{display:flex;justify-content:space-between;margin-top:8px;font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#b9cfe4;border-top:1px solid rgba(148,200,255,0.1);padding-top:6px}.empty-hint{padding:24px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8;border:1px dashed rgba(148,200,255,0.2);border-radius:10px;background:rgba(255,255,255,0.015)}#privacy-note{font-size:10px;color:#6d8aa5;margin-top:12px;line-height:1.6;border-top:1px solid rgba(148,200,255,0.1);padding-top:9px}#detail-card{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:1010;width:300px;background:linear-gradient(165deg,rgba(14,28,46,0.94),rgba(6,12,22,0.96));border:1px solid rgba(251,191,36,0.45);border-radius:14px;padding:16px 16px 14px;box-shadow:0 18px 50px rgba(0,0,0,0.7),0 0 0 1px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.06);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);animation:dcIn 0.3s cubic-bezier(0.4,0,0.2,1)}#detail-card::before{content:'';position:absolute;top:0;left:14px;right:14px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gold),rgba(251,191,36,0.1))}#detail-card.hidden{display:none}@keyframes dcIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}.dc-id{font-family:ui-monospace,Consolas,monospace;font-size:15px;color:var(--gold);margin-bottom:8px;padding-right:26px;font-weight:700}.dc-airline{font-size:11px;color:var(--accent-2);font-family:inherit}.dc-route{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.dc-iata{font-family:ui-monospace,Consolas,monospace;font-size:25px;font-weight:700;color:var(--text);letter-spacing:1px}.dc-arrow{color:var(--gold);font-size:18px}.dc-names{width:100%;font-size:11px;color:var(--muted);margin-top:4px}.dc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.dc-grid>div{background:rgba(251,191,36,0.05);border:1px solid rgba(251,191,36,0.16);border-radius:8px;padding:7px 9px}.dc-grid span{display:block;font-size:10px;color:var(--muted);margin-bottom:2px;letter-spacing:0.3px}.dc-grid b{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--text)}.detail-close{position:absolute;top:10px;right:10px;width:24px !important;height:24px;padding:0 !important;background:transparent !important;border:1px solid rgba(148,200,255,0.22) !important;color:var(--muted) !important;border-radius:6px;cursor:pointer;margin-top:0 !important;font-size:13px;line-height:1}.detail-close:hover{border-color:var(--danger) !important;color:var(--danger) !important;background:rgba(251,113,133,0.08) !important}#canvas2d{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.2s cubic-bezier(0.4,0,0.2,1)}#globeViz{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:2;transition:opacity 1.2s cubic-bezier(0.4,0,0.2,1);touch-action:none}body::before{content:'';position:absolute;top:-160px;left:10%;right:10%;height:320px;z-index:0;pointer-events:none;background:radial-gradient(60% 100% at 50% 0%,rgba(45,212,191,0.1),transparent 70%)}</style>
<style>#drop-ov{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;background:rgba(4,7,15,0.78);backdrop-filter:blur(4px);pointer-events:none}#drop-ov.on{display:flex}#drop-ov>div{font-size:22px;color:#2dd4bf;border:2px dashed #2dd4bf;border-radius:16px;padding:26px 44px;background:rgba(13,36,64,0.6);box-shadow:0 0 60px rgba(45,212,191,0.18);letter-spacing:1px}</style>

<body>
    <div id="drop-ov"><div>📥 松开导入 CSV · Drop CSV to import</div></div>
    <button id="btn-show-ui" onclick="toggleUI()" title="展开/收起面板">✈️</button>
    <div id="ui">
        <h3 id="ui-title">✈ 我的飞行足迹</h3>
        <div class="flex">
            <button id="b-zh" class="active" onclick="switchLang('zh')">中文</button>
            <button id="b-en" onclick="switchLang('en')">EN</button>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-num" id="st-count">0</div><div class="stat-label" id="lbl-count">飞行次数</div></div>
            <div class="stat-card"><div class="stat-num" id="st-dist">0</div><div class="stat-label"><span id="lbl-dist">飞行里程</span> <span class="stat-unit" id="u-dist">km</span></div></div>
            <div class="stat-card"><div class="stat-num" id="st-dur">0</div><div class="stat-label"><span id="lbl-dur">飞行时长</span> <span class="stat-unit" id="u-dur">小时</span></div></div>
            <div class="stat-card"><div class="stat-num" id="st-airports">0</div><div class="stat-label" id="lbl-air">到达机场</div></div>
            <div class="stat-card"><div class="stat-num" id="st-airlines">0</div><div class="stat-label" id="lbl-airlines">航空公司</div></div>
            <div class="stat-card"><div class="stat-num" id="st-avg">0</div><div class="stat-label"><span id="lbl-avg">平均航距</span> <span class="stat-unit">km</span></div></div><div class="stat-card"><div class="stat-num" id="st-busy">—</div><div class="stat-label" id="lbl-busy">最高频航线</div></div>
        </div>
        <div id="weight-legend" style="display:none;font-size:10px;color:var(--muted);margin-top:-6px;margin-bottom:10px;line-height:1.5"></div>
        <div class="group"><label id="l-file2" for="fIn2">导入飞行 CSV</label><input type="file" id="fIn2" accept=".csv"></div>
        <div class="flex">
            <button onclick="loadSample()" title="加载示例数据 · Load sample data">⚡ 加载示例</button>
            <button onclick="exportCSV()" title="导出当前航班为 CSV · Export CSV">💾 导出 CSV</button>
        </div>
        <div class="flex">
            <button id="sort-time" class="sort-btn active" onclick="setSort('time')">按时间</button>
            <button id="sort-dist" class="sort-btn" onclick="setSort('distance')">按里程</button><button id="sort-weight" class="sort-btn" onclick="setSort('weight')">按航次</button>
        </div>
        <div class="flex">
            <button id="btn-replay" onclick="startReplay()">▶ 行程回放</button>
            <button id="btn-stop" onclick="stopReplay()" style="display:none; margin-top:0;">⏹ 停止</button>
        </div>
        <div class="flex">
            <button id="btn-cancel-focus" onclick="clearFocus()">✕ 取消聚焦</button>
        </div>
        <div id="flight-list"></div>
        <div class="group">
            <label id="l-airport" for="airport-select">机场航线筛选</label>
            <select id="airport-select"><option value="" id="opt-airport">选择机场...</option></select>
            <div class="flex" style="margin-top:6px;">
                <button id="btn-dep" class="filter-btn" onclick="setAirportFilter('dep')">起飞航班</button>
                <button id="btn-arr" class="filter-btn" onclick="setAirportFilter('arr')">降落航班</button>
            </div>
            <button id="btn-reset-airport" onclick="clearAirportFilter()" disabled>重置筛选</button>
        </div>
        <div class="group">
            <label id="l-airline" for="airline-select">航空公司筛选</label>
            <select id="airline-select" onchange="setAirlineFilter()"><option value="" id="opt-airline">全部航空公司...</option></select>
        </div>
        <div class="group">
            <label id="l-search" for="src">机场搜索</label>
            <input type="text" id="src" placeholder="输入 纽约, new york, pvg..." autocomplete="off" oninput="debounceSearch()" onblur="hideSuggestions()" onkeydown="if(event.keyCode==13)goFirst()">
            <div id="sugg-box"></div>
        </div>
        <div class="group">
            <button onclick="toggleProjection()" id="btnProj">▤ 切换为 2D 展开图</button>
        </div>
        <div class="group">
            <label id="l-view" for="vMode">图层控制</label>
            <select id="vMode" onchange="renderLayers()">
                <option value="all">显示全部</option>
                <option value="arc">仅显示航线</option>
                <option value="hub">仅显示机场</option>
            </select>
        </div>
        <div class="group">
            <label id="l-theme" for="themeSel">地图主题</label>
            <select id="themeSel" onchange="setTheme()">
                <option value="color" id="opt-theme-color">卫星遥感 (Color)</option>
                <option value="dark" id="opt-theme-dark">极简暗色 (Dark)</option>
            </select>
        </div>
        <div class="group">
            <label id="l-rotate" for="rSpeed">自转速度</label>
            <select id="rSpeed" onchange="setRotation()">
                <option value="0" selected>静止 - 默认</option>
                <option value="4.0">快速</option>
                <option value="1.0">慢速</option>
            </select>
        </div>
        <div class="flex" style="margin-top: 15px;">
            <button id="btn-snap3d" onclick="exportSnapshot(false)">📸 3D 截图</button>
            <button id="btn-snap2d" onclick="exportSnapshot(true)">📸 2D 截图</button>
        </div>
        <div class="flex">
            <button id="btn-clear" onclick="clearAll()" style="color:#ff5555; border-color:#422;">清除数据</button>
        </div>
        <div id="privacy-note">🔒 所有飞行数据仅保存在本浏览器本地（localStorage），绝不上传到任何服务器。</div>
        <div id="sys-msg" role="status" aria-live="polite">内核启动中...</div>
    </div>
    <div id="detail-card" class="hidden">
        <button class="detail-close" id="detail-close-btn">✕</button>
        <div class="dc-id" id="dc-id"></div>
        <div class="dc-route" id="dc-route"></div>
        <div class="dc-grid" id="dc-grid"></div>
    </div>
    <canvas id="canvas2d"></canvas>
    <div id="globeViz"></div>
    <script src="libs/three.min.js"></script>
    <script src="libs/globe.gl.min.js"></script>
    <script>window.THREE&&window.THREE.Sprite?0:window.__THREE__&&(window.THREE=window.__THREE__);</script>
    <script src="libs/papaparse.min.js"></script>
    <script src="libs/topojson-client.min.js"></script>
