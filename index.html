<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Spatial Data Visualization</title>
    <script src="https://unpkg.com/globe.gl@2.25.3/dist/globe.gl.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stats.js/16/Stats.min.js"></script>
    
    <style>
        body { margin: 0; background: #000; color: #eee; font-family: system-ui; overflow: hidden; }
        
        /* UI 面板与平滑折叠动画 */
        #ui { position: absolute; top: 15px; right: 15px; z-index: 10; background: rgba(10,10,10,0.85); padding: 18px; border-radius: 8px; width: 300px; border: 1px solid #333; backdrop-filter: blur(4px); max-height: 90vh; overflow-y: auto; box-shadow: -4px 4px 15px rgba(0,0,0,0.8); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s; transform: translateX(0); }
        #ui.collapsed { transform: translateX(350px); opacity: 0; pointer-events: none; }
        
        /* 极简呼出按钮与收起按钮 */
        #btn-show-ui { position: absolute; top: 15px; right: 15px; z-index: 5; background: rgba(10,10,10,0.6); border: 1px solid #333; color: #aaa; width: 32px; height: 32px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); font-size: 16px; transition: 0.2s; padding: 0; }
        #btn-show-ui:hover { color: #00ff88; border-color: #00ff88; }
        
        .min-btn { position: absolute; top: 15px; right: 15px; width: 30px !important; height: 30px; padding: 0 !important; background: transparent !important; border: 1px solid #333 !important; color: #aaa !important; font-size: 14px !important; line-height: 1; text-align: center; border-radius: 4px; margin-top: 0 !important; transition: 0.2s; }
        .min-btn:hover { border-color: #ff5555 !important; color: #ff5555 !important; }

        h3 { margin: 0 0 12px; color: #00ff88; font-size: 16px; border-bottom: 1px solid #222; padding-bottom: 8px; width: 85%; }
        .group { margin-bottom: 10px; position: relative; }
        label { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 4px; font-weight: bold; }
        input[type="text"], input[type="file"], select, button { width: 100%; background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 8px; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
        button { cursor: pointer; transition: 0.2s; margin-top: 5px; }
        button:hover { border-color: #00ff88; }
        #sys-msg { font-size: 11px; color: #ffb86c; margin-top: 10px; font-family: monospace; line-height: 1.5; background: #111; padding: 8px; border-radius: 4px; border: 1px solid #333; }
        .active { border-color: #00ff88; color: #00ff88; }
        .flex { display: flex; gap: 5px; margin-bottom: 10px; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        
        #sugg-box { display: none; position: absolute; top: 100%; left: 0; width: 100%; background: rgba(20,20,20,0.95); border: 1px solid #444; border-radius: 4px; max-height: 280px; overflow-y: auto; z-index: 9999; margin-top: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.9); }
        .sugg-item { padding: 10px 12px; font-size: 12px; color: #ddd; cursor: pointer; border-bottom: 1px solid #333; line-height: 1.4; }
        .sugg-item:hover { background: #00ff88; color: #000; font-weight: bold; }
        .match-hl { color: #00ff88; font-weight: bold; }
        .sugg-item:hover .match-hl { color: #000; }
        .type-badge { display: inline-block; padding: 2px 4px; background: #333; border-radius: 3px; font-size: 10px; margin-right: 5px; color: #aaa; }
        
        #canvas2d { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        #globeViz { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body>
    <button id="btn-show-ui" onclick="toggleUI()" title="展开面板">⚙️</button>
    
    <div id="ui">
        <button class="min-btn" onclick="toggleUI()" title="收起控制面板">✕</button>
        <h3 id="ui-title">空间数据可视化</h3>
        <div class="flex">
            <button id="b-zh" class="active" onclick="switchLang('zh')">中文</button>
            <button id="b-en" onclick="switchLang('en')">EN</button>
        </div>
        
        <div class="group">
            <label id="l-search">节点搜索</label>
            <input type="text" id="src" placeholder="输入 纽约, new york, pvg..." autocomplete="off" oninput="debounceSearch()" onblur="hideSuggestions()" onkeydown="if(event.keyCode==13)goFirst()">
            <div id="sugg-box"></div>
        </div>

        <div class="group"><label id="l-file">导入航线数据 (.csv)</label><input type="file" id="fIn" accept=".csv"></div>

        <div class="group">
            <label id="l-theme">地图主题</label>
            <select id="gTheme" onchange="changeTheme()">
                <option value="color" selected>卫星遥感 (Color)</option>
                <option value="dark">暗色流向 (Dark)</option>
            </select>
            <button onclick="toggleProjection()" id="btnProj">▤ 切换为 2D 展开图</button>
        </div>

        <div class="group">
            <label id="l-view">图层控制</label>
            <select id="vMode" onchange="renderLayers()">
                <option value="all">显示全部</option>
                <option value="arc">仅显示航线</option>
                <option value="hub">仅显示机场</option>
            </select>
        </div>
        
        <div class="group">
            <label id="l-rotate">自转速度</label>
            <select id="rSpeed" onchange="setRotation()">
                <option value="0" selected>静止 - 默认</option>
                <option value="4.0">快速</option>
                <option value="1.0">慢速</option>
            </select>
        </div>

        <div class="flex" style="margin-top: 15px;">
            <button onclick="exportSnapshot(false)">📸 3D 截图</button>
            <button onclick="exportSnapshot(true)">📸 2D 截图</button>
        </div>
        <div class="flex">
            <button onclick="clearAll()" style="color:#ff5555; border-color:#422;">清除数据</button>
        </div>
        <div id="sys-msg">内核启动中...</div>
    </div>
    
    <canvas id="canvas2d"></canvas>
    <div id="globeViz"></div>

    <script>
        const statsObj = new Stats();
        statsObj.showPanel(0);
        statsObj.dom.style.position = 'absolute'; statsObj.dom.style.left = '15px'; statsObj.dom.style.top = '15px'; statsObj.dom.style.transform = 'scale(1.2)';
        statsObj.dom.style.zIndex = '100';
        document.body.appendChild(statsObj.dom);
        function animate() { statsObj.update(); requestAnimationFrame(animate); } requestAnimationFrame(animate);

        let db = {}, provs = [], lang = 'zh', curTheme = 'color', is2DMode = false;
        let largeCities = [], allCities = [], isAirportsOK = false, isProvsOK = false;
        let cLabelState = -1, cPolyState = -1; 
        
        let hasData = false; 

        let rawArcs = [], rawHubs = [], renderArcs = [], renderHubs = [];

        const dict = { zh: { title: "空间数据可视化", sLabel: "解析中..." }, en: { title: "Spatial Visualization", sLabel: "Parsing..." } };
        
        const T = {
            color: { img: './earth-color.jpg', arcN: '#00ffff', arcH: '#ff0055', pFill: 'rgba(255,255,255,0.08)', pStrk: 'rgba(255,255,255,0.6)', bg: 'rgba(0,0,0,0.7)', text: '#fff', border: 'transparent', atmos: '#3a80df', mapBg: '#051329' },
            dark:  { img: './earth-dark.jpg',  arcN: '#00ff88', arcH: '#ff0055', pFill: 'rgba(0,255,136,0.02)',  pStrk: 'rgba(68,68,68,0.8)', bg: 'rgba(0,0,0,0.8)', text: '#00ff88', border: '#00ff88', atmos: '#00ff88', mapBg: '#020202' }
        };

        const img2DColor = new Image(); img2DColor.src = T.color.img;
        const img2DDark = new Image(); img2DDark.src = T.dark.img;

        const normalizeStr = str => (str || '').toString().toLowerCase().replace(/[\s\-_]/g, '');
        function msg(text, color="#ffb86c") { document.getElementById('sys-msg').innerHTML = `<span style="color:${color}">${text}</span>`; }

        function toggleUI() {
            const ui = document.getElementById('ui');
            ui.classList.toggle('collapsed');
        }

        // ==========================================
        // 3D WebGL 引擎配置 (物理级解耦，杜绝链式调用崩溃)
        // ==========================================
        const world = Globe({ rendererConfig: { antialias: true, alpha: true, preserveDrawingBuffer: true } })(document.getElementById('globeViz'));

        world.globeImageUrl(T[curTheme].img);
        world.bumpImageUrl('./earth-topology.png');
        world.pointOfView({ alt: 2.5 });
        world.showAtmosphere(true);
        world.atmosphereColor(T[curTheme].atmos);
        world.atmosphereAltitude(0.15);
        
        world.labelLat(d => d.lt);
        world.labelLng(d => d.lg);
        world.labelText(d => d.iata);
        world.labelDotRadius(d => {
            const base = d.isLarge ? 0.20 : 0.12; 
            return base + Math.min(d.v * 0.05, 0.6); 
        });
        world.labelColor(d => {
            const alpha = Math.min(0.4 + (d.v * 0.15), 1.0); 
            return `rgba(255, 255, 255, ${alpha})`;
        });
        world.labelResolution(4); 
        
        world.arcStroke(d => Math.min(d.weight * 0.05, 2.0));
        world.arcColor(d => d.weight > 100 ? T[curTheme].arcH : T[curTheme].arcN);
        
        world.polygonCapColor(() => T[curTheme].pFill);
        world.polygonStrokeColor(() => T[curTheme].pStrk);
        world.polygonLabel(d => `<div style="background:${T[curTheme].bg}; padding:4px; border-radius:4px; color:${T[curTheme].text}; border:1px solid ${T[curTheme].border};"><b>${lang==='zh'?(d.properties.name_zh||d.properties.name):d.properties.name}</b></div>`);
        
        world.renderer().setPixelRatio(window.devicePixelRatio); 

        window.addEventListener('resize', () => { 
            world.width(window.innerWidth);
            world.height(window.innerHeight); 
            if(is2DMode) draw2DCanvas(); 
        });

        // ==========================================
        // 2D Canvas 高清物理贴图渲染引擎
        // ==========================================
        function draw2DCanvas() {
            const canvas = document.getElementById('canvas2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = T[curTheme].mapBg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const mapW = canvas.width; const mapH = mapW / 2;
            const offsetX = 0; const offsetY = (canvas.height - mapH) / 2;
            
            const bgImg = curTheme === 'color' ? img2DColor : img2DDark;
            if (bgImg.complete && bgImg.naturalWidth !== 0) {
                ctx.drawImage(bgImg, offsetX, offsetY, mapW, mapH);
            }
            
            ctx.fillStyle = curTheme === 'color' ? 'rgba(0, 5, 20, 0.15)' : 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(offsetX, offsetY, mapW, mapH);

            const getX = lng => offsetX + (lng + 180) * (mapW / 360);
            const getY = lat => offsetY + (90 - lat) * (mapH / 180);

            const v = document.getElementById('vMode').value;
            if(v !== 'hub') {
                ctx.lineWidth = 1;
                renderArcs.forEach(arc => {
                    ctx.beginPath();
                    ctx.strokeStyle = arc.weight > 100 ? T[curTheme].arcH : T[curTheme].arcN;
                    ctx.globalAlpha = Math.min(0.3 + arc.weight * 0.05, 1.0);
                    ctx.moveTo(getX(arc.startLng), getY(arc.startLat));
                    ctx.lineTo(getX(arc.endLng), getY(arc.endLat));
                    ctx.stroke();
                });
            }

            if(v !== 'arc') {
                renderHubs.forEach(hub => {
                    ctx.beginPath();
                    const alpha = Math.min(0.4 + (hub.v * 0.15), 1.0);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    const radius = Math.max(2.5, 2.5 + Math.min(hub.v * 1.5, 6)); 
                    ctx.arc(getX(hub.lg), getY(hub.lt), radius, 0, 2 * Math.PI);
                    ctx.fill();
                });
            }
            ctx.globalAlpha = 1.0;
        }

        function toggleProjection() {
            is2DMode = !is2DMode;
            const c = document.getElementById('canvas2d'), g = document.getElementById('globeViz'), btn = document.getElementById('btnProj');
            if (is2DMode) {
                draw2DCanvas();
                c.style.opacity = 1; c.style.pointerEvents = 'auto';
                g.style.opacity = 0; g.style.pointerEvents = 'none';
                btn.innerText = "▤ 恢复 3D 视图";
            } else {
                c.style.opacity = 0; c.style.pointerEvents = 'none';
                g.style.opacity = 1; g.style.pointerEvents = 'auto';
                btn.innerText = "▤ 切换为 2D 展开图";
            }
        }

        // ==========================================
        // 核心逻辑与数据处理
        // ==========================================
        function changeTheme() {
            curTheme = document.getElementById('gTheme').value;
            world.globeImageUrl(T[curTheme].img);
            world.atmosphereColor(T[curTheme].atmos); 
            world.arcColor(d => d.weight > 100 ? T[curTheme].arcH : T[curTheme].arcN);
            world.polygonCapColor(() => T[curTheme].pFill);
            world.polygonStrokeColor(() => T[curTheme].pStrk);
            if (isProvsOK) { 
                cPolyState = -1; 
                world.polygonLabel(world.polygonLabel()); 
                upd(); 
            }
            if(is2DMode) draw2DCanvas();
        }

        async function init() {
            Papa.parse("./optimized_airports.csv", {
                download: true, header: true, skipEmptyLines: true, fastMode: true,
                complete: r => {
                    r.data.forEach(x => { 
                        if(x.iata_code && (x.type === 'large_airport' || x.type === 'medium_airport')) { 
                            const item = { iata: x.iata_code.toUpperCase(), n: x.name, lt: +x.latitude_deg, lg: +x.longitude_deg, isLarge: x.type === 'large_airport', v: 0 };
                            db[item.iata] = item; allCities.push(item);
                            if(item.isLarge) largeCities.push(item);
                        } 
                    });
                    renderHubs = allCities; 
                    world.labelsData(renderHubs);
                    isAirportsOK = true; 
                    upd(); 
                }
            });

            fetch("./provinces.json").then(res => res.json()).then(tj => {
                provs = (tj.type === "Topology") ? topojson.feature(tj, tj.objects[Object.keys(tj.objects)[0]]).features : tj.features;
                isProvsOK = true; 
                upd(); 
            }).catch(()=>console.log('No provinces.json'));
        }

        function upd() {
            const alt = world.pointOfView().alt;
            if (isAirportsOK && !is2DMode) {
                if (hasData) {
                    if (cLabelState !== 'data_locked') {
                        cLabelState = 'data_locked';
                        const v = document.getElementById('vMode').value;
                        world.labelsData(v==='arc' ? [] : renderHubs);
                        world.labelSize(0.18); 
                    }
                } else {
                    let tLabel = alt > 1.5 ? 0 : (alt > 0.6 ? 1 : 2);
                    if (tLabel !== cLabelState) {
                        cLabelState = tLabel;
                        const displayData = tLabel === 0 ? [] : (tLabel === 1 ? largeCities : allCities);
                        world.labelsData(displayData);
                        world.labelSize(tLabel === 1 ? 0.20 : 0.12); 
                    }
                }
            }
            if (isProvsOK && !is2DMode) {
                let tPoly = alt < 1.6 ? 1 : 0;
                if (tPoly !== cPolyState) {
                    cPolyState = tPoly;
                    world.polygonsData(tPoly === 1 ? provs : []);
                }
            }
        }

        document.getElementById('fIn').onchange = e => {
            const file = e.target.files[0]; if (!file) return;
            msg(dict[lang].sLabel, "#00ffff");
            
            Papa.parse(file, {
                header: true, skipEmptyLines: true, fastMode: true,
                complete: function(r) {
                    const arcs = []; const hubs = new Map();
                    r.data.forEach(row => {
                        const o_code = (row.origin_iata || row.origin || '').trim().toUpperCase();
                        const d_code = (row.dest_iata || row.dest || '').trim().toUpperCase();
                        
                        const origin = db[o_code], dest = db[d_code];
                        const weight = parseInt(row.weight) || 1; 
                        
                        if (origin && dest) {
                            arcs.push({ startLat: origin.lt, startLng: origin.lg, endLat: dest.lt, endLng: dest.lg, weight: weight });
                            if(!hubs.has(origin.iata)) hubs.set(origin.iata, {iata: origin.iata, v:0});
                            if(!hubs.has(dest.iata)) hubs.set(dest.iata, {iata: dest.iata, v:0});
                            hubs.get(origin.iata).v += weight; hubs.get(dest.iata).v += weight;
                        }
                    });
                    rawArcs = arcs; 
                    rawHubs = Array.from(hubs.values());
                    hasData = true; 
                    
                    applyDataMapping(); 
                    msg(`✅ 解析完成: 获取 ${rawArcs.length} 条有效航线。`);
                },
                error: function(err) { msg(`解析错误 - ${err.message}`, "red"); }
            });
        };

        function applyDataMapping() {
            renderArcs = rawArcs; 
            allCities.forEach(c => c.v = 0);
            
            const activeNodes = [];
            rawHubs.forEach(h => { 
                if (db[h.iata] && h.v >= 1) { 
                    db[h.iata].v = h.v; 
                    activeNodes.push(db[h.iata]);
                }
            });
            renderHubs = activeNodes; 
            
            cLabelState = -1; 
            renderLayers();
        }

        function renderLayers() {
            const v = document.getElementById('vMode').value;
            world.arcsData(v==='hub'?[]:renderArcs);
            
            if (hasData) {
                world.labelsData(v==='arc' ? [] : renderHubs);
            } else {
                cLabelState = -1;
                upd();
            }

            if (v !== 'arc') {
                world.labelColor(world.labelColor());
                world.labelDotRadius(world.labelDotRadius());
            }
            if(is2DMode) draw2DCanvas();
        }

        function clearAll() { 
            rawArcs=[]; rawHubs=[]; renderArcs=[]; 
            allCities.forEach(c => c.v = 0); 
            renderHubs = allCities;
            hasData = false; 
            
            document.getElementById('fIn').value=''; 
            cLabelState = -1; 
            renderLayers(); 
            msg("数据已清除，已恢复全域节点显示。"); 
        }

        function exportSnapshot(capture2D) { 
            const a = document.createElement('a');
            if (capture2D) {
                draw2DCanvas();
                a.href = document.getElementById('canvas2d').toDataURL('image/jpeg', 1.0);
                a.download = `Map_2D_${Date.now()}.jpg`;
            } else {
                world.renderer().render(world.scene(), world.camera()); 
                a.href = world.renderer().domElement.toDataURL('image/jpeg', 1.0); 
                a.download = `Globe_3D_${Date.now()}.jpg`;
            }
            a.click(); 
        }

        function setRotation() { 
            const val = parseFloat(document.getElementById('rSpeed').value); 
            world.controls().autoRotate = (val > 0); 
            if (val > 0) world.controls().autoRotateSpeed = val; 
        }
        
        function switchLang(l) {
            lang = l;
            ['zh', 'en'].forEach(k => document.getElementById(`b-${k}`).className = l===k?'active':'');
            document.getElementById('ui-title').innerText = dict[l].title;
            if (isProvsOK && !is2DMode) world.polygonLabel(world.polygonLabel()); 
        }

        world.onZoom(upd); 
        init(); 
        setRotation(); 
    </script>
</body>
</html>
