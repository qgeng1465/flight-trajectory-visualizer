<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>✈ 我的飞行足迹</title>
    <!-- 样式内联；库脚本放在 body 底部，让 UI 先渲染 -->

    <style>
        body { margin: 0; background: #000; color: #eee; font-family: system-ui; overflow: hidden; }

        /* ===== 右侧合并控制台 ===== */
        #ui { position: absolute; top: 15px; right: 15px; z-index: 1000; pointer-events: auto; background: rgba(10,10,10,0.9); padding: 18px; border-radius: 8px; width: 340px; border: 1px solid #333; backdrop-filter: blur(6px); max-height: 90vh; overflow-y: auto; box-shadow: -4px 4px 20px rgba(0,0,0,0.9); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s; transform: translateX(0); }
        #ui.collapsed { transform: translateX(calc(100% + 30px)); opacity: 0; pointer-events: none; }
        #ui * { pointer-events: auto; }

        /* 呼出按钮：始终位于面板右上角之上，同一按钮负责展开/收起 */
        #btn-show-ui { position: absolute; top: 15px; right: 15px; z-index: 1001; pointer-events: auto; background: rgba(10,10,10,0.9); border: 1px solid #444; color: #aaa; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px); font-size: 18px; transition: 0.2s; padding: 0; user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        #btn-show-ui:hover { color: #00ff88; border-color: #00ff88; transform: scale(1.08); background: rgba(10,10,10,1); }
        #btn-show-ui:active { transform: scale(0.95); }

        h3 { margin: 0 0 12px; color: #00ff88; font-size: 16px; border-bottom: 1px solid #222; padding-bottom: 8px; width: 85%; }
        .group { margin-bottom: 10px; position: relative; }
        label { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 4px; font-weight: bold; }
        input[type="text"], input[type="file"], select, button { width: 100%; background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 8px; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
        input[type="file"], select, button { cursor: pointer; }
        input[type="text"] { cursor: text; }
        input[type="file"]::-webkit-file-upload-button { cursor: pointer; }
        button { cursor: pointer; transition: 0.2s; margin-top: 5px; }
        button:hover { border-color: #00ff88; }
        button:disabled { opacity: 0.4; cursor: not-allowed; border-color: #333; color: #777; }
        #sys-msg { font-size: 11px; color: #ffb86c; margin-top: 10px; font-family: monospace; line-height: 1.5; background: #111; padding: 8px; border-radius: 4px; border: 1px solid #333; }
        .active { border-color: #00ff88; color: #00ff88; }
        .flex { display: flex; gap: 5px; margin-bottom: 10px; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        #sugg-box { display: none; position: absolute; top: 100%; left: 0; width: 100%; background: rgba(20,20,20,0.95); border: 1px solid #444; border-radius: 4px; max-height: 280px; overflow-y: auto; z-index: 9999; margin-top: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.9); }
        .sugg-item { padding: 10px 12px; font-size: 12px; color: #ddd; cursor: pointer; border-bottom: 1px solid #333; line-height: 1.4; }
        .sugg-item:hover { background: #00ff88; color: #000; font-weight: bold; }
        .match-hl { color: #00ff88; font-weight: bold; }
        .sugg-item:hover .match-hl { color: #000; }
        .type-badge { display: inline-block; padding: 2px 4px; background: #333; border-radius: 3px; font-size: 10px; margin-right: 5px; color: #aaa; }

        /* ===== 统计卡片 ===== */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .stat-card { background: rgba(0,255,136,0.05); border: 1px solid #234; border-radius: 6px; padding: 10px 8px; text-align: center; }
        .stat-num { font-family: monospace; font-size: 20px; font-weight: bold; color: #00ff88; line-height: 1.1; }
        .stat-label { font-size: 10px; color: #999; margin-top: 5px; }
        .stat-unit { color: #00ff88; }

        /* ===== 排序 / 回放 / 机场筛选 按钮 ===== */
        .sort-btn { flex: 1; margin-top: 0; }
        .sort-btn.active { border-color: #00ff88; color: #00ff88; background: rgba(0,255,136,0.1); }
        .filter-btn { flex: 1; margin-top: 0; }
        .filter-btn.active { border-color: #00ccff; color: #00ccff; background: rgba(0,204,255,0.08); }
        #btn-replay { border-color: #ffcc00; color: #ffcc00; }
        #btn-replay:hover { background: rgba(255,204,0,0.12); }
        #btn-stop { border-color: #ff5555; color: #ff5555; }
        #btn-cancel-focus:hover { border-color: #ffcc00; color: #ffcc00; }

        /* ===== 航班列表 ===== */
        #flight-list { max-height: 34vh; overflow-y: auto; margin-top: 6px; padding-right: 4px; }
        .flight-card { background: rgba(255,255,255,0.03); border: 1px solid #2a2a2a; border-left: 3px solid #333; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: 0.18s; }
        .flight-card:hover { background: rgba(0,255,136,0.08); border-color: #00ff88; border-left-color: #00ff88; transform: translateX(3px); }
        .flight-card.selected { background: rgba(255,204,0,0.12); border-color: #ffcc00; border-left-color: #ffcc00; box-shadow: 0 0 12px rgba(255,204,0,0.25); transform: translateX(3px); }
        .fc-row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .fc-id { font-family: monospace; font-weight: bold; color: #00ff88; font-size: 13px; }
        .flight-card.selected .fc-id { color: #ffcc00; }
        .fc-date { font-family: monospace; font-size: 11px; color: #999; }
        .fc-row2 { display: flex; align-items: center; gap: 10px; }
        .fc-iata { font-family: monospace; font-size: 22px; font-weight: bold; color: #fff; letter-spacing: 1px; }
        .fc-plane { color: #00ff88; font-size: 14px; }
        .flight-card.selected .fc-plane { color: #ffcc00; }
        .fc-names { font-size: 10px; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fc-row3 { display: flex; justify-content: space-between; margin-top: 8px; font-family: monospace; font-size: 11px; color: #bbb; border-top: 1px solid #222; padding-top: 6px; }
        .empty-hint { padding: 22px 16px; text-align: center; color: #888; font-size: 12px; line-height: 1.7; border: 1px dashed #333; border-radius: 6px; }
        #privacy-note { font-size: 10px; color: #777; margin-top: 12px; line-height: 1.6; border-top: 1px solid #222; padding-top: 8px; }

        /* ===== 航班详情卡 ===== */
        #detail-card { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 1010; width: 290px; background: rgba(10,10,10,0.92); border: 1px solid #ffcc00; border-radius: 10px; padding: 16px 16px 14px; box-shadow: 0 8px 28px rgba(0,0,0,0.85); backdrop-filter: blur(6px); animation: dcIn 0.3s ease; }
        #detail-card.hidden { display: none; }
        @keyframes dcIn { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
        .dc-id { font-family: monospace; font-size: 15px; color: #ffcc00; margin-bottom: 8px; padding-right: 26px; }
        .dc-route { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .dc-iata { font-family: monospace; font-size: 24px; font-weight: bold; color: #fff; }
        .dc-arrow { color: #ffcc00; font-size: 18px; }
        .dc-names { width: 100%; font-size: 11px; color: #999; margin-top: 4px; }
        .dc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .dc-grid > div { background: rgba(255,204,0,0.06); border: 1px solid #433; border-radius: 5px; padding: 6px 8px; }
        .dc-grid span { display: block; font-size: 10px; color: #999; margin-bottom: 2px; }
        .dc-grid b { font-family: monospace; font-size: 13px; color: #eee; }
        .detail-close { position: absolute; top: 10px; right: 10px; width: 24px !important; height: 24px; padding: 0 !important; background: transparent !important; border: 1px solid #444 !important; color: #aaa !important; border-radius: 4px; cursor: pointer; margin-top: 0 !important; font-size: 13px; }
        .detail-close:hover { border-color: #ff5555 !important; color: #ff5555 !important; }

        #canvas2d { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        #globeViz { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); touch-action: none; }
    </style>
</head>
<body>
    <!-- 右侧呼出按钮 + 合并控制台 -->
    <button id="btn-show-ui" onclick="toggleUI()" title="展开/收起面板">✈️</button>
    <div id="ui">
        <h3 id="ui-title">✈ 我的飞行足迹</h3>
        <div class="flex">
            <button id="b-zh" class="active" onclick="switchLang('zh')">中文</button>
            <button id="b-en" onclick="switchLang('en')">EN</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-num" id="st-count">0</div><div class="stat-label" id="lbl-count">飞行次数</div></div>
            <div class="stat-card"><div class="stat-num" id="st-dist">0</div><div class="stat-label"><span id="lbl-dist">飞行里程</span> <span class="stat-unit" id="u-dist">km</span></div></div>
            <div class="stat-card"><div class="stat-num" id="st-dur">0</div><div class="stat-label"><span id="lbl-dur">飞行时长</span> <span class="stat-unit" id="u-dur">小时</span></div></div>
            <div class="stat-card"><div class="stat-num" id="st-airports">0</div><div class="stat-label" id="lbl-air">到达机场</div></div>
        </div>

        <div class="group"><label id="l-file2">导入飞行 CSV</label><input type="file" id="fIn2" accept=".csv"></div>

        <div class="flex">
            <button id="sort-time" class="sort-btn active" onclick="setSort('time')">按时间</button>
            <button id="sort-dist" class="sort-btn" onclick="setSort('distance')">按里程</button>
        </div>

        <div class="flex">
            <button id="btn-replay" onclick="startReplay()">▶ 行程回放</button>
            <button id="btn-stop" onclick="stopReplay()" style="display:none; margin-top:0;">⏹ 停止</button>
        </div>
        <div class="flex">
            <button id="btn-cancel-focus" onclick="clearFocus()">✕ 取消聚焦</button>
        </div>

        <div id="flight-list"></div>

        <div class="group">
            <label id="l-airport">机场航线筛选</label>
            <select id="airport-select"><option value="" id="opt-airport">选择机场...</option></select>
            <div class="flex" style="margin-top:6px;">
                <button id="btn-dep" class="filter-btn" onclick="setAirportFilter('dep')">起飞航班</button>
                <button id="btn-arr" class="filter-btn" onclick="setAirportFilter('arr')">降落航班</button>
            </div>
            <button id="btn-reset-airport" onclick="clearAirportFilter()" disabled>重置筛选</button>
        </div>

        <div class="group">
            <label id="l-search">机场搜索</label>
            <input type="text" id="src" placeholder="输入 纽约, new york, pvg..." autocomplete="off" oninput="debounceSearch()" onblur="hideSuggestions()" onkeydown="if(event.keyCode==13)goFirst()">
            <div id="sugg-box"></div>
        </div>

        <div class="group">
            <label id="l-theme">地图主题</label>
            <select id="gTheme" onchange="changeTheme()">
                <option value="color" selected>卫星遥感 (Color)</option>
                <option value="dark">暗色流向 (Dark)</option>
            </select>
            <button onclick="toggleProjection()" id="btnProj">▤ 切换为 2D 展开图</button>
        </div>

        <div class="group">
            <label id="l-view">图层控制</label>
            <select id="vMode" onchange="renderLayers()">
                <option value="all">显示全部</option>
                <option value="arc">仅显示航线</option>
                <option value="hub">仅显示机场</option>
            </select>
        </div>

        <div class="group">
            <label id="l-rotate">自转速度</label>
            <select id="rSpeed" onchange="setRotation()">
                <option value="0" selected>静止 - 默认</option>
                <option value="4.0">快速</option>
                <option value="1.0">慢速</option>
            </select>
        </div>

        <div class="flex" style="margin-top: 15px;">
            <button id="btn-snap3d" onclick="exportSnapshot(false)">📸 3D 截图</button>
            <button id="btn-snap2d" onclick="exportSnapshot(true)">📸 2D 截图</button>
        </div>
        <div class="flex">
            <button id="btn-clear" onclick="clearAll()" style="color:#ff5555; border-color:#422;">清除数据</button>
        </div>

        <div id="privacy-note">🔒 所有飞行数据仅保存在本浏览器本地（localStorage），绝不上传到任何服务器。</div>
        <div id="sys-msg">内核启动中...</div>
    </div>

    <!-- 航班详情卡 -->
    <div id="detail-card" class="hidden">
        <button class="detail-close" onclick="hideDetail()">✕</button>
        <div class="dc-id" id="dc-id"></div>
        <div class="dc-route" id="dc-route"></div>
        <div class="dc-grid" id="dc-grid"></div>
    </div>

    <canvas id="canvas2d"></canvas>
    <div id="globeViz"></div>

    <!-- 先加载本地内置库；若本地缺失则静默回退 CDN（异步），主脚本会做可用性检查 -->
    <script src="libs/three.min.js"></script>
    <script src="libs/globe.gl.min.js"></script>
    <script src="libs/papaparse.min.js"></script>
    <script src="libs/topojson-client.min.js"></script>
    <script src="libs/Stats.min.js"></script>
    <script>
    (function(){
        const libs = [
            {name:'THREE', file:'libs/three.min.js', cdn:'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'},
            {name:'Globe', file:'libs/globe.gl.min.js', cdn:'https://unpkg.com/globe.gl@2.25.3/dist/globe.gl.min.js'},
            {name:'Papa', file:'libs/papaparse.min.js', cdn:'https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js'},
            {name:'topojson', file:'libs/topojson-client.min.js', cdn:'https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js'},
            {name:'Stats', file:'libs/Stats.min.js', cdn:'https://cdnjs.cloudflare.com/ajax/libs/stats.js/16/Stats.min.js'}
        ];
        libs.forEach(l => {
            if (window[l.name]) return;
            const s = document.createElement('script'); s.src = l.cdn; s.async = false;
            document.head.appendChild(s);
        });
    })();
    </script>

    <script>
        const statsObj = new Stats();
        statsObj.showPanel(0);
        statsObj.dom.style.position = 'absolute'; statsObj.dom.style.right = '15px'; statsObj.dom.style.bottom = '15px'; statsObj.dom.style.transform = 'scale(1.2)';
        statsObj.dom.style.zIndex = '100';
        document.body.appendChild(statsObj.dom);

        // 轻量 rAF 循环：持续运行，确保交互/动画不卡顿
        function animate() {
            requestAnimationFrame(animate);
            try {
                statsObj.update();
                // 自转由我们自己驱动，避免依赖 OrbitControls
                if (autoRotateSpeed > 0 && !isDragging && !replaying && !selectedId && !filterAirport) {
                    const pov = world.pointOfView();
                    world.pointOfView({ lat: pov.lat, lng: pov.lng + autoRotateSpeed * 0.025, altitude: pov.altitude });
                }
                // 自适应渲染像素比
                const now = performance.now();
                _fpsFrames++;
                if (now - _fpsLast >= 500) {
                    const fps = _fpsFrames * 1000 / (now - _fpsLast);
                    _fpsFrames = 0; _fpsLast = now;
                    if (fps < 40) { _prLo++; _prHi = 0; if (_prLo >= 2 && currentPR > 0.75) { currentPR = Math.max(0.75, +(currentPR - 0.25).toFixed(2)); applyPR(); _prLo = 0; } }
                    else if (fps > 57) { _prHi++; _prLo = 0; if (_prHi >= 2 && currentPR < TARGET_PR) { currentPR = Math.min(TARGET_PR, +(currentPR + 0.25).toFixed(2)); applyPR(); _prHi = 0; } }
                    else { _prLo = 0; _prHi = 0; }
                }
            } catch (e) { /* 吞掉异常，保证看门狗永不中断 */ }
        }
        requestAnimationFrame(animate);

        // ===== 全局状态 =====
        let db = {}, provs = [], lang = 'zh', curTheme = 'color', is2DMode = false;
        let largeCities = [], allCities = [], idleCities = [], isAirportsOK = false, isProvsOK = false, provsLoading = false;
        let cLabelState = -1, cPolyState = -1;
        let hasData = false;
        let rawArcs = [], rawHubs = [], renderArcs = [], renderHubs = [];
        let airportTraffic = new Map();   // 每个机场的航线流量（用于光斑亮度累加）
        let glowData = [];               // 3D 光斑 custom layer 数据
        let glowTextureCache = {};       // 按颜色缓存光斑贴图

        // ===== 机场航线筛选状态 =====
        let filterAirport = null;        // 当前选中的机场 IATA
        let filterMode = null;           // 'dep' | 'arr'

        // ===== 自定义地球鼠标交互状态 =====
        let isDragging = false, dragStartX = 0, dragStartY = 0, dragHasMoved = false;
        let autoRotateSpeed = 0;

        // ===== 飞行记录簿状态 =====
        let flights = [];          // 主数据（已 enrich），canonical 按时间升序
        let selectedId = null;     // 当前选中航班 key
        let sortMode = 'time';     // 'time' | 'distance'
        let replaying = false;
        const LS_KEY = 'flightTracker.flights';
        const HL_COLOR = '#ffcc00';
        const DIM_COLOR = 'rgba(140,140,140,0.16)';
        const MAX_IDLE_LABELS = 200;

        // ===== 多语言字典 =====

                filterCount: '（{n} 条）',

                snap3d: '📸 3D 截图', snap2d: '📸 2D 截图', clear: '清除数据',

                viewAll: '显示全部', viewArc: '仅显示航线', viewHub: '仅显示机场',
                rotStop: '静止 - 默认', rotFast: '快速', rotSlow: '慢速', sLabel: '解析中...',
                panelTitle: '✈ 我的飞行足迹', stCount: '飞行次数', stDist: '飞行里程', stDur: '飞行时长', stAir: '到达机场',
                uDist: 'km', uDur: '小时', importBtn: '导入飞行 CSV', sortTime: '按时间', sortDist: '按里程',

                viewAll: 'Show All', viewArc: 'Arcs Only', viewHub: 'Airports Only',
                rotStop: 'Still - Default', rotFast: 'Fast', rotSlow: 'Slow', sLabel: 'Parsing...',
                panelTitle: '✈ My Flight Footprints', stCount: 'Flights', stDist: 'Distance', stDur: 'Duration', stAir: 'Airports',

        const T = {

            dark:  { img: './earth-dark.jpg',  arcN: '#00ff88', arcH: '#ff0055', glow: '#00ff88', pFill: 'rgba(0,255,136,0.02)',  pStrk: 'rgba(68,68,68,0.8)', bg: 'rgba(0,0,0,0.8)', text: '#00ff88', border: '#00ff88', atmos: '#00ff88', mapBg: '#020202' }

        const img2DColor = new Image(), img2DDark = new Image();
        const img2DReq = { color: false, dark: false };
        function ensure2DImage(theme) {
            const img = theme === 'color' ? img2DColor : img2DDark;

        // ===== 工具函数 =====
        const normalizeStr = str => (str || '').toString().toLowerCase().replace(/[\s\-_]/g, '');
        const pad = n => String(n).padStart(2, '0');
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
        function msg(text, color = "#ffb86c") { document.getElementById('sys-msg').innerHTML = `<span style="color:${color}">${text}</span>`; }

        function fmtDate(ts) { if (!ts) return '—'; const d = new Date(ts); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
        function fmtTime(ts) { if (!ts) return '—'; const d = new Date(ts); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; }

        // Haversine 大圆距离（km）
        function haversineKm(a, b) {
            const R = 6371, toRad = Math.PI / 180;
            const dLat = (b.lt - a.lt) * toRad, dLng = (b.lg - a.lg) * toRad;
            const la1 = a.lt * toRad, la2 = b.lt * toRad;
            const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(h));
        }

        // 从一行（已小写化 key）中按候选列名取值
        function pick(obj, keys) { for (const k of keys) { const v = obj[k]; if (v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim(); } return ''; }

        function toggleUI() { document.getElementById('ui').classList.toggle('collapsed'); }

        // ==========================================
        // 3D WebGL 引擎配置
        // ==========================================
        const world = Globe({ rendererConfig: { antialias: true, alpha: true, preserveDrawingBuffer: false, powerPreference: 'high-performance' } })(document.getElementById('globeViz'));
        window.world = world; // 便于调试与外部测试

        // 自定义鼠标/触摸交互：滚轮缩放 + 拖拽旋转
        // 由于 globe.gl 内置 OrbitControls 在某些环境下对滚轮/拖拽不敏感，
        // 这里直接用 pointer/wheel 事件驱动 pointOfView，保证最基础的自由操作一定可用。
        function configureControls() {
            const ctrl = world.controls();
            if (!ctrl) return;
            // 关闭内置 manual 交互，避免与自定义控制冲突
            ctrl.enableZoom = false;
            ctrl.enableRotate = false;
            ctrl.enablePan = false;
            ctrl.autoRotate = false;
            ctrl.minDistance = 120;
            ctrl.maxDistance = 12000;
        }
        configureControls();

        const globeContainer = document.getElementById('globeViz');
        const ROTATE_SENSITIVITY = 0.18;
        const ZOOM_SENSITIVITY = 0.0012;
        const MIN_ALTITUDE = 0.25;
        const MAX_ALTITUDE = 12;
        const DRAG_THRESHOLD = 5;

        function setupCustomInteraction() {
            if (!globeContainer) return;
            globeContainer.style.cursor = 'grab';

            function onPointerDown(e) {
                if (is2DMode) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                dragHasMoved = false;
                dragStartX = e.clientX; dragStartY = e.clientY;
                isDragging = true;
                try { globeContainer.setPointerCapture(e.pointerId); } catch (_) {}
                globeContainer.style.cursor = 'grabbing';
                keepRendering(2000);
            }
            function onPointerMove(e) {
                if (!isDragging || is2DMode) return;
                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;
                if (!dragHasMoved) {
                    if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
                    dragHasMoved = true;
                }
                const pov = world.pointOfView();
                const lat = Math.max(-90, Math.min(90, pov.lat - dy * ROTATE_SENSITIVITY));
                const lng = pov.lng - dx * ROTATE_SENSITIVITY;
                world.pointOfView({ lat, lng, altitude: pov.altitude });
                dragStartX = e.clientX; dragStartY = e.clientY;
                keepRendering(200);
            }
            function onPointerUp(e) {
                isDragging = false;
                try { globeContainer.releasePointerCapture(e.pointerId); } catch (_) {}
                globeContainer.style.cursor = 'grab';
                updThrottled();
            }
            function onWheel(e) {
                if (is2DMode) return;
                e.preventDefault();
                const pov = world.pointOfView();
                const factor = 1 + e.deltaY * ZOOM_SENSITIVITY;
                const altitude = Math.max(MIN_ALTITUDE, Math.min(MAX_ALTITUDE, pov.altitude * factor));
                world.pointOfView({ lat: pov.lat, lng: pov.lng, altitude });
                updThrottled();
                keepRendering(500);
            }
            globeContainer.addEventListener('pointerdown', onPointerDown);
            globeContainer.addEventListener('pointermove', onPointerMove);
            globeContainer.addEventListener('pointerup', onPointerUp);
            globeContainer.addEventListener('pointercancel', onPointerUp);
            globeContainer.addEventListener('wheel', onWheel, { passive: false });
        }
        setupCustomInteraction();

        // 机场标签：默认显示 IATA；放大后由 upd() 切换为 IATA + 名称
        world.labelLat(d => d.lt);
        world.labelLng(d => d.lg);
        world.labelText(d => d._labelText || d.iata);
        world.labelDotRadius(d => d._dotR);
        world.labelColor(d => d._labelColor);
        world.labelResolution(2);

        // 点击机场标签可进入该机场的航线筛选
        world.onLabelClick((d, ev, coords) => { if (d && d.iata && d.v > 0) selectAirport(d.iata); });

        function enrichHubs(hubs) {
            hubs.forEach(d => {
                // 活跃机场用光斑替代白色圆点，标签处不再显示白色圆点
                if (d.v > 0) {
                    d._dotR = 0;
                } else {
                    d._dotR = d.isLarge ? 0.12 : 0.08;
                }
                const alpha = d.v > 0 ? Math.min(0.85 + (d.v * 0.08), 1.0) : Math.min(0.35 + (d.v * 0.15), 0.9);
                d._labelColor = `rgba(255, 255, 255, ${alpha})`;
            });
        }

        // ===== 弧线样式访问器（使用数据属性，避免每帧函数调用 + 选中时全量重建）=====
        function enrichArcs() {
            const sel = selectedId;
            rawArcs.forEach(d => {
                const isSel = sel && d._fid === sel;
                if (isSel) {
                    d._color = HL_COLOR;
                    d._stroke = 0.9;
                    d._dashLen = 0.32;
                    d._dashGap = 0.85;
                    d._dashTime = 1700;
                } else if (sel) {
                    d._color = DIM_COLOR;
                    d._stroke = 0.18;
                    d._dashLen = 1;
                    d._dashGap = 0;
                    d._dashTime = 0;
                } else {
                    d._color = d.weight > 100 ? T[curTheme].arcH : T[curTheme].arcN;
                    d._stroke = 0.35;
                    d._dashLen = 1;
                    d._dashGap = 0;
                    d._dashTime = 0;
                }
            });
        }

        world.arcStroke('_stroke');
        world.arcColor('_color');
        world.arcDashLength('_dashLen');
        world.arcDashGap('_dashGap');
        world.arcDashInitialGap(0);
        world.arcDashAnimateTime('_dashTime');

        world.polygonCapColor(() => T[curTheme].pFill);
        world.polygonStrokeColor(() => T[curTheme].pStrk);
        world.polygonLabel(d => `<div style="background:${T[curTheme].bg}; padding:4px; border-radius:4px; color:${T[curTheme].text}; border:1px solid ${T[curTheme].border};"><b>${lang === 'zh' ? (d.properties.name_zh || d.properties.name) : d.properties.name}</b></div>`);

        // ===== 3D 光斑层（到达机场） =====
        function getGlowTexture(color) {
            if (glowTextureCache[color]) return glowTextureCache[color];
            const c = document.createElement('canvas');
            c.width = 128; c.height = 128;
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            g.addColorStop(0, color);
            g.addColorStop(0.35, color);
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 128, 128);
            const tex = new THREE.CanvasTexture(c);
            tex.needsUpdate = true;
            glowTextureCache[color] = tex;
            return tex;
        }

        function createGlowMaterial(color) {
            return new THREE.SpriteMaterial({
                map: getGlowTexture(color),
                color: 0xffffff,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
        }

        if (typeof THREE !== 'undefined') {
            world.customThreeObject(d => {
                const mat = createGlowMaterial(d.color);
                mat.opacity = d.opacity || 0.85;
                const sprite = new THREE.Sprite(mat);
                sprite.scale.set(d.scale, d.scale, 1);
                return sprite;
            });
            world.customThreeObjectUpdate((obj, d) => {
                obj.scale.set(d.scale, d.scale, 1);
                obj.material.opacity = d.opacity || 0.85;
                const desired = d.color;
                if (obj.material.userData.lastColor !== desired) {
                    obj.material.map = getGlowTexture(desired);
                    obj.material.userData.lastColor = desired;
                }
            });
        }

        // ===== P1/P2 渲染调度：按需渲染 + 自适应像素比 =====
        let renderUntil = 0, paused = false;
        const TARGET_PR = Math.min(window.devicePixelRatio || 1, 2);
        let currentPR = TARGET_PR;
        let _fpsLast = performance.now(), _fpsFrames = 0, _prLo = 0, _prHi = 0;

        function keepRendering(ms = 1500) {
            // 已不再暂停内部渲染循环，此函数保留供兼容性调用
            renderUntil = Math.max(renderUntil, performance.now() + ms);
        }
        function applyPR() {
            world.renderer().setPixelRatio(currentPR);
            world.width(window.innerWidth);
            world.height(window.innerHeight);
        }
        // 相机过渡包装
        function flyTo(pov, ms) { world.pointOfView(pov, ms); }

        world.renderer().setPixelRatio(TARGET_PR);

        ['wheel', 'pointerdown', 'touchstart'].forEach(ev =>
            window.addEventListener(ev, () => keepRendering(1500), { passive: true }));

        // 重新计算弧线样式（仅刷新数据属性；3D 下一帧自动生效，2D 需要重绘）
        function refreshArcStyle() {
            enrichArcs();
            if (is2DMode) draw2DCanvas();
        }

        let _rszTimer = null;
        window.addEventListener('resize', () => {
            world.width(window.innerWidth);
            world.height(window.innerHeight);
            clearTimeout(_rszTimer);
            _rszTimer = setTimeout(() => {
                if (is2DMode) draw2DCanvas();
                keepRendering(1500);
            }, 120);
        });

        // ==========================================
        // 2D Canvas 高清物理贴图渲染引擎
        // ==========================================
        function draw2DCanvas() {
            const canvas = document.getElementById('canvas2d');
            const W = window.innerWidth, H = window.innerHeight;
            const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
            canvas.width = Math.floor(W * dpr);
            canvas.height = Math.floor(H * dpr);
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            ctx.fillStyle = T[curTheme].mapBg;
            ctx.fillRect(0, 0, W, H);

            const mapW = W; const mapH = mapW / 2;
            const offsetX = 0; const offsetY = (H - mapH) / 2;

            const bgImg = curTheme === 'color' ? img2DColor : img2DDark;
            if (bgImg.complete && bgImg.naturalWidth !== 0) {
                ctx.drawImage(bgImg, offsetX, offsetY, mapW, mapH);
            }

            ctx.fillStyle = curTheme === 'color' ? 'rgba(0, 5, 20, 0.15)' : 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(offsetX, offsetY, mapW, mapH);

            const getX = lng => offsetX + (lng + 180) * (mapW / 360);
            const getY = lat => offsetY + (90 - lat) * (mapH / 180);

            const v = document.getElementById('vMode').value;
            const arcs = getFilteredArcs();
            if (v !== 'hub') {
                arcs.forEach(arc => {
                    ctx.beginPath();
                    const isSel = selectedId && arc._fid === selectedId;
                    ctx.strokeStyle = isSel ? HL_COLOR : (selectedId ? 'rgba(120,120,120,0.28)' : arc._color);
                    ctx.lineWidth = isSel ? 2.6 : (selectedId ? 0.8 : 1.2);
                    ctx.globalAlpha = isSel ? 1.0 : (selectedId ? 0.55 : 0.85);
                    ctx.moveTo(getX(arc.startLng), getY(arc.startLat));
                    ctx.lineTo(getX(arc.endLng), getY(arc.endLat));
                    ctx.stroke();
                });
            }

            const hubs = getFilteredHubs();
            if (v !== 'arc') {
                hubs.forEach(hub => {
                    const cx = getX(hub.lg), cy = getY(hub.lt);
                    // 光斑（按航线流量累加亮度）
                    const tc = airportTraffic.get(hub.iata) || 0;
                    if (tc > 0) {
                        const r = 3 + tc * 2;
                        const intensity = Math.min(0.4 + tc * 0.08, 0.9);
                        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                        g.addColorStop(0, T[curTheme].glow);
                        g.addColorStop(0.5, T[curTheme].glow);
                        g.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = g;
                        ctx.globalAlpha = intensity;
                        ctx.beginPath();
                        ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                    // 小中心点
                    ctx.globalAlpha = 0.8;
                    ctx.beginPath();
                    ctx.fillStyle = hub.iata === filterAirport ? '#00ccff' : '#fff';
                    ctx.arc(cx, cy, 2.0, 0, 2 * Math.PI);
                    ctx.fill();

                    // 机场名称
                    ctx.fillStyle = hub.iata === filterAirport ? '#00ccff' : 'rgba(255,255,255,0.9)';
                    ctx.font = '11px system-ui';
                    ctx.fillText(`${hub.iata} · ${hub.n}`, cx + 6, cy + 3);
                });
            }
            ctx.globalAlpha = 1.0;
        }

        function toggleProjection() {
            is2DMode = !is2DMode;
            const c = document.getElementById('canvas2d'), g = document.getElementById('globeViz'), btn = document.getElementById('btnProj');
            if (is2DMode) {
                ensure2DImage(curTheme);
                draw2DCanvas();
                c.style.opacity = 1; c.style.pointerEvents = 'auto';
                g.style.opacity = 0; g.style.pointerEvents = 'none';
                btn.innerText = i18n[lang].btnProj3d;
            } else {
                c.style.opacity = 0; c.style.pointerEvents = 'none';
                g.style.opacity = 1; g.style.pointerEvents = 'auto';
                btn.innerText = i18n[lang].btnProj2d;
            }
            keepRendering(1500);
        }

        // ==========================================
        // 核心逻辑与数据处理
        // ==========================================
        function changeTheme() {
            curTheme = document.getElementById('gTheme').value;
            world.globeImageUrl(T[curTheme].img);
            world.atmosphereColor(T[curTheme].atmos);
            enrichArcs();
            enrichHubs(renderHubs);
            updateGlowData();
            world.polygonCapColor(() => T[curTheme].pFill);
            world.polygonStrokeColor(() => T[curTheme].pStrk);
            if (isProvsOK) {
                cPolyState = -1;

            if (is2DMode) { ensure2DImage(curTheme); draw2DCanvas(); }

        }

        async function init() {
            keepRendering(4000);
            // 每次进入都是新会话，不恢复旧 CSV 轨迹
            try { localStorage.removeItem(LS_KEY); } catch (e) { /* ignore */ }
            flights = []; selectedId = null; filterAirport = null; filterMode = null;

            if (typeof Papa === 'undefined') { msg('❌ CSV 解析库未能加载，请检查网络后刷新页面', 'red'); return; }
            Papa.parse("./optimized_airports.csv", {
                download: true, header: true, skipEmptyLines: true, fastMode: true,
                complete: r => {
                    try {
                        r.data.forEach(x => {
                            if (x.iata_code && (x.type === 'large_airport' || x.type === 'medium_airport')) {
                                const item = { iata: x.iata_code.toUpperCase(), n: x.name, lt: +x.latitude_deg, lg: +x.longitude_deg, isLarge: x.type === 'large_airport', v: 0 };
                                db[item.iata] = item; allCities.push(item);
                                if (item.isLarge) largeCities.push(item);
                            }
                        });
                        const stride = Math.max(1, Math.ceil(largeCities.length / MAX_IDLE_LABELS));
                        idleCities = largeCities.filter((_, i) => i % stride === 0);
                        enrichHubs(allCities);
                        renderHubs = allCities;
                        world.labelsData([]);
                        world.customLayerData([]);
                        isAirportsOK = true;

                        updateStats();
                        renderFlightList();
                        buildAirportSelect();
                        msg(lang === 'zh' ? '✅ 就绪 · 导入飞行 CSV 开始记录足迹' : '✅ Ready · import a flight CSV to begin', '#00ff88');
                        upd();
                    } catch (e) {
                        console.error('init error', e);
                        msg('⚠ 初始化出错：' + (e && e.message ? e.message : e), 'red');
                    }
                },
                error: err => { msg('❌ 机场数据加载失败，请确认 optimized_airports.csv 存在：' + (err && err.message ? err.message : err), 'red'); }
            });
        }

        // P4：省界懒加载——首次需要显示时才 fetch + 解析
        function loadProvinces() {
            if (isProvsOK || provsLoading) return;
            provsLoading = true;
            fetch("./provinces.json").then(res => res.json()).then(tj => {
                provs = (tj.type === "Topology") ? topojson.feature(tj, tj.objects[Object.keys(tj.objects)[0]]).features : tj.features;
                isProvsOK = true;
                keepRendering(1500);
                upd();
            }).catch(() => { provsLoading = false; console.log('No provinces.json'); });
        }

        function upd() {
            const alt = world.pointOfView().altitude;
            if (isAirportsOK && !is2DMode) {
                if (hasData) {
                    // 0=不显示 1=只显示 IATA 2=显示 IATA + 名称
                    let tLabel = alt > 1.5 ? 0 : (alt > 0.5 ? 1 : 2);
                    if (cLabelState !== tLabel) {
                        cLabelState = tLabel;
                        const v = document.getElementById('vMode').value;
                        const hubs = getFilteredHubs();
                        if (tLabel === 0) {
                            world.labelsData([]);
                        } else {
                            hubs.forEach(d => { d._labelText = (tLabel === 2 && d.n) ? `${d.iata} · ${d.n}` : d.iata; });
                            world.labelsData(v === 'arc' ? [] : hubs.slice());
                            world.labelSize(tLabel === 1 ? 0.16 : 0.22);
                        }
                        keepRendering(1200);
                    }
                } else {
                    let tLabel = alt > 1.5 ? 0 : (alt > 0.6 ? 1 : 2);
                    if (tLabel !== cLabelState) {
                        cLabelState = tLabel;
                        const displayData = tLabel === 0 ? [] : (tLabel === 1 ? idleCities : largeCities);
                        world.labelsData(displayData);
                        world.labelSize(tLabel === 1 ? 0.20 : 0.12);
                        keepRendering(1200);
                    }
                }
            }
            if (!is2DMode) {
                let tPoly = alt < 1.6 ? 1 : 0;
                if (tPoly === 1 && !isProvsOK) loadProvinces();
                if (isProvsOK && tPoly !== cPolyState) {
                    cPolyState = tPoly;
                    world.polygonsData(tPoly === 1 ? provs : []);
                    keepRendering(1200);
                }
            }
        }

        // ==========================================
        // CSV 导入（每次新 CSV 替换旧数据）
        // ==========================================
        function onFileChosen(e) {
            const file = e.target.files[0]; if (!file) return;
            importFlights(file);
            e.target.value = '';
        }

        function importFlights(file) {
            msg(i18n[lang].sLabel, "#00ffff");
            // 新 CSV 替换旧轨迹
            stopReplay();
            clearAirportFilter(false);
            flights = [];
            selectedId = null;
            hideDetail();
            Papa.parse(file, {
                header: true, skipEmptyLines: true, fastMode: true,
                complete: function (r) {
                    let added = 0, invalid = 0;
                    r.data.forEach(row => {
                        const norm = {};
                        for (const k in row) { if (Object.prototype.hasOwnProperty.call(row, k)) norm[String(k).toLowerCase().trim()] = row[k]; }
                        const origin = pick(norm, ['origin', 'origin_iata', 'from', 'dep']).toUpperCase();
                        const dest = pick(norm, ['dest', 'dest_iata', 'to', 'arr']).toUpperCase();
                        const flight_id = pick(norm, ['flight_id', 'flight', 'flight_no', 'no']);
                        const time = pick(norm, ['time', 'dep_time', 'departure', 'date']);
                        const f = makeFlight(flight_id, origin, dest, time);
                        if (!f) { invalid++; return; }
                        flights.push(f); added++;
                    });
                    sortFlightsAsc();
                    persistFlights();
                    selectedId = null;
                    rebuildFromFlights();
                    if (flights.length) overviewPOV();
                    msg(importResultText(added, invalid), added > 0 ? '#00ff88' : '#ffb86c');
                },
                error: function (err) { msg(`解析错误 / Parse error - ${err.message}`, "red"); }
            });
        }

        function importResultText(a, i) {
            return i18n[lang].importMsg.replace('{a}', a).replace('{i}', i).replace('{t}', flights.length);
        }

        // 构造并 enrich 一条航班记录；无效则返回 null
        function makeFlight(flight_id, origin, dest, time) {
            if (!origin || !dest || origin === dest) return null;
            const o = db[origin], d = db[dest];
            if (!o || !d) return null;
            const dist = haversineKm(o, d);
            const dur = dist / 850 + 0.5;
            const ts = time ? (Date.parse(time) || 0) : 0;
            const fid = flight_id || '—';
            const key = `${fid}|${origin}|${dest}|${time || ''}`;
            return { flight_id: fid, origin, dest, time: time || '', key, ts, dist, dur };
        }

        function sortFlightsAsc() { flights.sort((a, b) => (a.ts - b.ts) || a.key.localeCompare(b.key)); }

        // 由 flights 重建弧线 / 枢纽并刷新全部 UI
        function rebuildFromFlights() {
            const arcs = [];
            const hubs = new Map();
            airportTraffic = new Map();
            flights.forEach(f => {
                const o = db[f.origin], d = db[f.dest];
                if (!o || !d) return;
                arcs.push({ _fid: f.key, _origin: f.origin, _dest: f.dest, startLat: o.lt, startLng: o.lg, endLat: d.lt, endLng: d.lg, weight: 1 });
                if (!hubs.has(o.iata)) hubs.set(o.iata, { iata: o.iata, v: 0 });
                if (!hubs.has(d.iata)) hubs.set(d.iata, { iata: d.iata, v: 0 });
                hubs.get(o.iata).v++; hubs.get(d.iata).v++;
                airportTraffic.set(f.origin, (airportTraffic.get(f.origin) || 0) + 1);
                airportTraffic.set(f.dest, (airportTraffic.get(f.dest) || 0) + 1);
            });
            rawArcs = arcs;
            rawHubs = Array.from(hubs.values());
            hasData = flights.length > 0;
            enrichArcs();
            applyDataMapping();
            updateStats();
            renderFlightList();
            buildAirportSelect();
            keepRendering(1500);
        }

        function applyDataMapping() {
            allCities.forEach(c => c.v = 0);
            rawHubs.forEach(h => { if (db[h.iata]) db[h.iata].v = h.v; });
            const activeNodes = [];
            rawHubs.forEach(h => { if (db[h.iata] && h.v >= 1) activeNodes.push(db[h.iata]); });
            enrichHubs(activeNodes.length ? activeNodes : allCities);
            renderHubs = activeNodes.length ? activeNodes : allCities;
            cLabelState = -1;
            renderLayers();
        }

        // ===== 机场筛选 =====
        function buildAirportSelect() {
            const sel = document.getElementById('airport-select');
            if (!sel) return;
            const cur = sel.value;
            const active = Array.from(new Set(flights.map(f => f.origin).concat(flights.map(f => f.dest))))
                .map(iata => db[iata]).filter(Boolean)
                .sort((a, b) => a.iata.localeCompare(b.iata));
            const blank = `<option value="">${i18n[lang].selAirport}</option>`;
            sel.innerHTML = blank + active.map(a => `<option value="${esc(a.iata)}">${esc(a.iata)} · ${esc(a.n)}</option>`).join('');
            if (cur && Array.from(sel.options).some(o => o.value === cur)) sel.value = cur;
            else if (filterAirport) sel.value = filterAirport;
        }

        function selectAirport(iata) {
            const a = db[iata]; if (!a) return;
            const sel = document.getElementById('airport-select');
            if (sel) sel.value = iata;
            setAirportFilter('dep');
            flyTo({ lat: a.lt, lng: a.lg, altitude: 1.6 }, 900);
            msg(`${i18n[lang].focused} ${a.iata} · ${a.n}`, '#00ff88');
        }

        function setAirportFilter(mode) {
            const sel = document.getElementById('airport-select');
            const iata = sel ? sel.value : '';
            if (!iata) { msg('请先选择一个机场 / Please select an airport first'); return; }
            filterAirport = iata;
            filterMode = mode;
            selectedId = null;
            hideDetail();
            refreshArcStyle();
            renderLayers();
            updateFilterUI();
            const a = db[iata];
            if (a) flyTo({ lat: a.lt, lng: a.lg, altitude: 1.5 }, 900);
            const count = getFilteredArcs().length;
            const t = i18n[lang];
            const tmpl = t[mode === 'dep' ? 'filterDep' : 'filterArr'];
            msg(`${tmpl.replace('{ap}', iata)} ${t.filterCount.replace('{n}', count)}`, '#00ccff');
        }

        function clearAirportFilter(resetView = true) {
            filterAirport = null;
            filterMode = null;
            const sel = document.getElementById('airport-select');
            if (sel) sel.value = '';
            updateFilterUI();
            renderLayers();
            if (resetView) overviewPOV();
        }

        function updateFilterUI() {
            const dep = document.getElementById('btn-dep');
            const arr = document.getElementById('btn-arr');
            const reset = document.getElementById('btn-reset-airport');
            if (dep) dep.classList.toggle('active', filterMode === 'dep');
            if (arr) arr.classList.toggle('active', filterMode === 'arr');
            if (reset) reset.disabled = !filterAirport;
        }

        function getFilteredArcs() {
            if (!filterAirport || !filterMode) return rawArcs;
            return rawArcs.filter(a => (filterMode === 'dep' ? a._origin === filterAirport : a._dest === filterAirport));
        }

        function getFilteredHubs() {
            if (!filterAirport || !filterMode) return renderHubs;
            const involved = new Set([filterAirport]);
            getFilteredArcs().forEach(a => { involved.add(a._origin); involved.add(a._dest); });
            const nodes = [];
            involved.forEach(iata => { if (db[iata]) nodes.push(db[iata]); });
            enrichHubs(nodes);
            return nodes;
        }

        function updateGlowData() {
            const hubs = getFilteredHubs();
            glowData = [];
            if (typeof THREE === 'undefined') return;
            hubs.forEach(h => {
                const tc = airportTraffic.get(h.iata) || 0;
                if (tc > 0) {
                    const intensity = Math.min(0.5 + tc * 0.08, 1.0);
                    glowData.push({
                        lat: h.lt, lng: h.lg, altitude: 0.03,
                        iata: h.iata, name: h.n, traffic: tc,
                        color: T[curTheme].glow,
                        scale: 1.8 + tc * 0.6,
                        opacity: intensity
                    });
                }
            });
            world.customLayerData(glowData);
        }

        function renderLayers() {
            const v = document.getElementById('vMode').value;
            const arcs = getFilteredArcs();
            const hubs = getFilteredHubs();
            world.arcsData(v === 'hub' ? [] : arcs);
            updateGlowData();

            if (hasData) {
                world.labelsData(v === 'arc' ? [] : hubs);
            } else {
                cLabelState = -1;
                upd();
            }
            if (is2DMode) draw2DCanvas();
            keepRendering(1500);
        }

        function clearAll() {
            if (flights.length > 0 && !confirm(i18n[lang].confirmClear)) return;
            stopReplay();
            selectedId = null;
            clearAirportFilter(false);
            flights = []; rawArcs = []; rawHubs = []; renderArcs = [];
            airportTraffic = new Map();
            glowData = [];
            allCities.forEach(c => c.v = 0);
            enrichHubs(allCities);
            renderHubs = allCities;
            hasData = false;
            try { localStorage.removeItem(LS_KEY); } catch (e) { /* ignore */ }
            document.getElementById('fIn2').value = '';
            cLabelState = -1;
            hideDetail();
            renderLayers();
            updateStats();
            renderFlightList();
            buildAirportSelect();
            overviewPOV();
            msg(i18n[lang].cleared);
        }

        // ==========================================
        // 统计卡片
        // ==========================================
        function updateStats() {
            const count = flights.length;
            let dist = 0; const set = new Set();
            flights.forEach(f => { dist += f.dist; set.add(f.origin); set.add(f.dest); });
            const dur = flights.reduce((s, f) => s + f.dur, 0);
            document.getElementById('st-count').textContent = count;
            document.getElementById('st-dist').textContent = Math.round(dist).toLocaleString();
            document.getElementById('st-dur').textContent = dur.toFixed(1);
            document.getElementById('st-airports').textContent = set.size;
        }

        // ==========================================
        // 航班列表渲染
        // ==========================================
        function setSort(mode) {
            sortMode = mode;
            document.getElementById('sort-time').className = 'sort-btn' + (mode === 'time' ? ' active' : '');
            document.getElementById('sort-dist').className = 'sort-btn' + (mode === 'distance' ? ' active' : '');
            renderFlightList();
        }

        function renderFlightList() {
            const box = document.getElementById('flight-list');
            if (!box) return;
            if (flights.length === 0) { box.innerHTML = `<div class="empty-hint">${i18n[lang].empty}</div>`; return; }
            const arr = flights.slice();
            if (sortMode === 'time') arr.sort((a, b) => (b.ts - a.ts) || a.key.localeCompare(b.key));
            else arr.sort((a, b) => (b.dist - a.dist) || a.key.localeCompare(b.key));
            box.innerHTML = arr.map(flightCardHTML).join('');
            box.querySelectorAll('.flight-card').forEach(el => el.addEventListener('click', () => selectFlight(el.dataset.fid)));
            markSelectedCard();
        }

        function flightCardHTML(f) {
            const o = db[f.origin], d = db[f.dest];
            const names = (o ? o.n : f.origin) + ' → ' + (d ? d.n : f.dest);
            const sel = f.key === selectedId ? ' selected' : '';
            return `<div class="flight-card${sel}" data-fid="${esc(f.key)}">
                <div class="fc-row1"><span class="fc-id">${esc(f.flight_id)}</span><span class="fc-date">${fmtDate(f.ts)}</span></div>
                <div class="fc-row2"><span class="fc-iata">${f.origin}</span><span class="fc-plane">✈</span><span class="fc-iata">${f.dest}</span></div>
                <div class="fc-names">${esc(names)}</div>
                <div class="fc-row3"><span>🛫 ${fmtTime(f.ts)}</span><span>⏱ ${f.dur.toFixed(1)}h</span><span>📏 ${Math.round(f.dist)}km</span></div>
            </div>`;
        }

        function markSelectedCard() {
            document.querySelectorAll('.flight-card').forEach(el => el.classList.toggle('selected', el.dataset.fid === selectedId));
        }

        // ==========================================
        // 选中航班 -> 高亮 + 聚焦 + 详情
        // ==========================================
        function selectFlight(fid, opts = {}) {
            // 单条航线查看时先退出机场筛选，避免冲突
            clearAirportFilter(false);
            selectedId = fid;
            markSelectedCard();
            refreshArcStyle();
            const f = flights.find(x => x.key === fid);
            if (f) {
                focusArc(f, opts.flyMs);
                if (!opts.noDetail) showDetail(f);
            }
            const el = document.querySelector(`.flight-card[data-fid="${cssEscape(fid)}"]`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function cssEscape(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\\]]/g, '\\$&'); }

        function focusArc(f, ms = 900) {
            const o = db[f.origin], d = db[f.dest]; if (!o || !d) return;
            const lat = (o.lt + d.lt) / 2;
            let lng;
            if (Math.abs(o.lg - d.lg) > 180) {
                let a = o.lg, b = d.lg; if (a < 0) a += 360; if (b < 0) b += 360;
                lng = (a + b) / 2; if (lng > 180) lng -= 360;
            } else { lng = (o.lg + d.lg) / 2; }
            const alt = Math.min(2.8, Math.max(1.05, f.dist / 2600 + 0.85));
            flyTo({ lat, lng, altitude: alt }, ms);
        }

        function clearFocus() {
            stopReplay();
            selectedId = null;
            clearAirportFilter(false);
            markSelectedCard();
            refreshArcStyle();
            hideDetail();
            overviewPOV();
        }

        // 将全部航班纳入视野
        function overviewPOV() {
            const arcs = getFilteredArcs();
            if (flights.length === 0 || arcs.length === 0) { flyTo({ lat: 20, lng: 0, altitude: 2.5 }, 900); return; }
            let slat = 0, slng = 0, n = 0, minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
            arcs.forEach(a => {
                const pts = [[a.startLat, a.startLng], [a.endLat, a.endLng]];
                pts.forEach(([lt, lg]) => {
                    slat += lt; slng += lg; n++;
                    minLat = Math.min(minLat, lt); maxLat = Math.max(maxLat, lt);
                    minLng = Math.min(minLng, lg); maxLng = Math.max(maxLng, lg);
                });
            });
            if (n === 0) { flyTo({ lat: 20, lng: 0, altitude: 2.5 }, 900); return; }
            const lat = slat / n, lng = slng / n;
            const span = Math.max(maxLat - minLat, maxLng - minLng);
            const alt = Math.min(2.8, Math.max(1.4, span / 42 + 1.0));
            flyTo({ lat, lng, altitude: alt }, 900);
        }

        // ==========================================
        // 行程回放
        // ==========================================
        function setReplaying(on) {
            replaying = on;
            document.getElementById('btn-replay').style.display = on ? 'none' : 'block';
            document.getElementById('btn-stop').style.display = on ? 'block' : 'none';
        }

        const REPLAY_MS_PER_FLIGHT = 2600;
        const REPLAY_FLY_MS = 700;
        let replayRaf = null, replaySeq = [], replayIdx = -1, replayT0 = 0, replayEndTimer = null;

        function startReplay() {
            if (flights.length === 0) { msg(i18n[lang].noReplay); return; }
            stopReplay();
            // 回放时退出机场筛选与单条高亮，避免冲突
            clearAirportFilter(false);
            selectedId = null;
            hideDetail();
            refreshArcStyle();
            replaySeq = flights.slice().sort((a, b) => (a.ts - b.ts) || a.key.localeCompare(b.key));
            replayIdx = -1;
            replayT0 = performance.now();
            setReplaying(true);
            replayRaf = requestAnimationFrame(replayLoop);
        }

        function replayLoop(now) {
            if (!replaying) return;
            if (replayIdx >= replaySeq.length - 1) {
                // 最后一条保持一会儿后退出回放并恢复全局视角
                replayEndTimer = setTimeout(() => { stopReplay(); clearFocus(); }, Math.max(0, REPLAY_MS_PER_FLIGHT - (now - replayT0) % REPLAY_MS_PER_FLIGHT));
                return;
            }
            const dt = now - replayT0;
            const idx = Math.min(Math.floor(dt / REPLAY_MS_PER_FLIGHT), replaySeq.length - 1);
            if (idx !== replayIdx) {
                replayIdx = idx;
                const f = replaySeq[replayIdx];
                selectedId = f.key;
                refreshArcStyle();
                focusArc(f, REPLAY_FLY_MS);
                setTimeout(() => updThrottled(), REPLAY_FLY_MS + 50);
                markSelectedCard();
                const el = document.querySelector(`.flight-card[data-fid="${cssEscape(f.key)}"]`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            replayRaf = requestAnimationFrame(replayLoop);
        }

        function stopReplay() {
            if (replayRaf) { cancelAnimationFrame(replayRaf); replayRaf = null; }
            if (replayEndTimer) { clearTimeout(replayEndTimer); replayEndTimer = null; }
            if (replaying) setReplaying(false);
        }

        // ==========================================
        // 航班详情卡
        // ==========================================
        function showDetail(f) {
            const o = db[f.origin], d = db[f.dest]; if (!o || !d) return;
            const t = i18n[lang];
            document.getElementById('dc-id').innerHTML = `✈ <b>${esc(f.flight_id)}</b>`;
            document.getElementById('dc-route').innerHTML =
                `<span class="dc-iata">${f.origin}</span><span class="dc-arrow">→</span><span class="dc-iata">${f.dest}</span>` +
                `<div class="dc-names">${esc(o.n)} → ${esc(d.n)}</div>`;
            document.getElementById('dc-grid').innerHTML =
                `<div><span>${t.dDate}</span><b>${fmtDate(f.ts)}</b></div>` +
                `<div><span>${t.dDep}</span><b>${fmtTime(f.ts)}</b></div>` +
                `<div><span>${t.dDur}</span><b>${f.dur.toFixed(1)} h</b></div>` +
                `<div><span>${t.dDist}</span><b>${Math.round(f.dist)} km</b></div>`;
            document.getElementById('detail-card').classList.remove('hidden');
        }

        function hideDetail() { document.getElementById('detail-card').classList.add('hidden'); }

        // ==========================================
        // 本地持久化（纯 localStorage，绝不上传；但启动时不自动恢复）
        // ==========================================
        function persistFlights() {
            try {
                const minimal = flights.map(f => ({ flight_id: f.flight_id, origin: f.origin, dest: f.dest, time: f.time }));
                localStorage.setItem(LS_KEY, JSON.stringify(minimal));
            } catch (e) { console.warn('persist failed', e); }
        }

        // ==========================================
        // 机场搜索（补齐原占位但缺失的实现）
        // ==========================================
        let searchTimer = null;
        function debounceSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 200); }
        function doSearch() {
            const q = normalizeStr(document.getElementById('src').value);
            const box = document.getElementById('sugg-box');
            if (!q) { box.style.display = 'none'; return; }
            const matches = allCities.filter(c => normalizeStr(c.iata).includes(q) || normalizeStr(c.n).includes(q)).slice(0, 40);
            if (matches.length === 0) { box.innerHTML = `<div class="sugg-item" style="cursor:default;color:#888">${i18n[lang].noMatch}</div>`; box.style.display = 'block'; return; }
            box.innerHTML = matches.map(c => {
                const badge = `<span class="type-badge">${c.isLarge ? i18n[lang].badgeL : i18n[lang].badgeM}</span>`;
                return `<div class="sugg-item" data-iata="${c.iata}">${badge}<b class="match-hl">${c.iata}</b> · ${esc(c.n)}</div>`;
            }).join('');
            box.querySelectorAll('.sugg-item[data-iata]').forEach(el => el.addEventListener('click', () => selectSuggestion(el.dataset.iata)));
            box.style.display = 'block';
        }
        function selectSuggestion(iata) {
            hideSuggestions(true);
            document.getElementById('src').value = '';
            const a = db[iata]; if (!a) return;
            selectAirport(iata);
        }
        function hideSuggestions(immediate) { const box = document.getElementById('sugg-box'); if (immediate) { box.style.display = 'none'; return; } setTimeout(() => { box.style.display = 'none'; }, 180); }
        function goFirst() { const first = document.querySelector('#sugg-box .sugg-item[data-iata]'); if (first) selectSuggestion(first.dataset.iata); }

        // ==========================================
        // 截图 / 自转 / 语言
        // ==========================================
        function exportSnapshot(capture2D) {
            const a = document.createElement('a');
            if (capture2D) {
                draw2DCanvas();
                a.href = document.getElementById('canvas2d').toDataURL('image/jpeg', 1.0);
                a.download = `Map_2D_${Date.now()}.jpg`;
            } else {
                world.renderer().render(world.scene(), world.camera());
                a.href = world.renderer().domElement.toDataURL('image/jpeg', 1.0);
                a.download = `Globe_3D_${Date.now()}.jpg`;
            }
            a.click();
        }

        function setRotation() {
            const val = parseFloat(document.getElementById('rSpeed').value);
            autoRotateSpeed = val;
            if (world.controls()) world.controls().autoRotate = false;
            keepRendering(1500);
        }

        function setSelOptions(selId, map) {
            const sel = document.getElementById(selId); if (!sel) return;
            Array.from(sel.options).forEach(o => { if (map[o.value]) o.textContent = map[o.value]; });
        }

        function applyLang() {
            const t = i18n[lang];
            document.title = t.pageTitle;
            document.getElementById('ui-title').innerText = t.panelTitle;
            document.getElementById('l-search').innerText = t.lSearch;
            document.getElementById('src').placeholder = t.searchPh;
            document.getElementById('l-theme').innerText = t.lTheme;
            document.getElementById('l-view').innerText = t.lView;
            document.getElementById('l-rotate').innerText = t.lRotate;
            document.getElementById('l-airport').innerText = t.lAirport;
            document.getElementById('opt-airport').innerText = t.selAirport;
            document.getElementById('btn-dep').innerText = t.btnDep;
            document.getElementById('btn-arr').innerText = t.btnArr;
            document.getElementById('btn-reset-airport').innerText = t.resetFilter;
            document.getElementById('btnProj').innerText = is2DMode ? t.btnProj3d : t.btnProj2d;
            document.getElementById('btn-snap3d').innerText = t.snap3d;
            document.getElementById('btn-snap2d').innerText = t.snap2d;
            document.getElementById('btn-clear').innerText = t.clear;
            document.getElementById('lbl-count').innerText = t.stCount;
            document.getElementById('lbl-dist').innerText = t.stDist;
            document.getElementById('lbl-dur').innerText = t.stDur;
            document.getElementById('lbl-air').innerText = t.stAir;
            document.getElementById('u-dist').innerText = t.uDist;
            document.getElementById('u-dur').innerText = t.uDur;
            document.getElementById('l-file2').innerText = t.importBtn;
            document.getElementById('sort-time').innerText = t.sortTime;
            document.getElementById('sort-dist').innerText = t.sortDist;
            document.getElementById('btn-replay').innerText = t.replay;
            document.getElementById('btn-stop').innerText = t.stop;
            document.getElementById('btn-cancel-focus').innerText = t.cancelFocus;
            document.getElementById('privacy-note').innerText = t.privacy;
            setSelOptions('gTheme', { color: t.themeColor, dark: t.themeDark });
            setSelOptions('vMode', { all: t.viewAll, arc: t.viewArc, hub: t.viewHub });
            setSelOptions('rSpeed', { '0': t.rotStop, '4.0': t.rotFast, '1.0': t.rotSlow });
            renderFlightList();
            buildAirportSelect();
            if (isProvsOK && !is2DMode) world.polygonLabel(world.polygonLabel());
        }

        function switchLang(l) {
            lang = l;
            ['zh', 'en'].forEach(k => document.getElementById(`b-${k}`).className = l === k ? 'active' : '');
            applyLang();
            keepRendering(1500);
        }

        // ===== 启动 =====
        world.resumeAnimation(); // 确保内部渲染循环持续运行，不暂停
        document.getElementById('fIn2').onchange = onFileChosen;
        let _updPending = false;
        function updThrottled() {
            if (_updPending) return;
            _updPending = true;
            requestAnimationFrame(() => { _updPending = false; upd(); });
        }
        world.onZoom(updThrottled);
        init();
        setRotation();
        applyLang();
        updateStats();
    </script>
</body>
